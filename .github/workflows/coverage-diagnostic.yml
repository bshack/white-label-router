name: Coverage diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage || true
      - name: Persist diagnostic report
        run: |
          cp coverage/coverage-final.json coverage-diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-diagnostic.json
          git commit -m "Capture detailed router coverage diagnostic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
