name: Coverage diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage || true
      - name: Persist uncovered branch locations
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const coverage = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
          const file = Object.values(coverage)[0];
          const uncovered = [];
          for (const [id, counts] of Object.entries(file.b)) {
            counts.forEach((count, index) => {
              if (count === 0) uncovered.push({id, index, map: file.branchMap[id]});
            });
          }
          fs.writeFileSync('coverage-diagnostic.json', JSON.stringify(uncovered, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-diagnostic.json
          git commit -m "Capture uncovered router branch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
