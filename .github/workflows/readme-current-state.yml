name: Keep README current-state only

on:
  push:
    branches:
      - docs/remove-version-history-20260911
    paths:
      - .github/workflows/readme-current-state.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove release-history documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          removals = [
          """### Version 5 migration

`navigate()` no longer accepts `false` as a sentinel URL; omit the URL or pass `undefined` when routing the current URL. A configured mediator must provide both `on()` and `removeListener()` so router teardown can always release its subscription. No compatibility adapters are retained.

""",
          """## Version 3 migration note

Version 3 changes route matching from unrestricted string prefixes to path boundaries. A route such as `/page2` no longer matches `/page23`. Define `/page23` explicitly if the application previously depended on that behavior.

""",
          """This is a major release because the distribution is now CommonJS emitted by TypeScript, replacing the previous UMD wrapper. CommonJS `require` and the documented ESM imports remain supported. Direct AMD loading or browser script tags that depended on UMD globals must migrate to a browser bundler. Edit `src/*.ts`, then run `npm run build`; do not edit generated `dist` files. The obsolete Babel build dependencies have been removed.

""",
          """To undo this migration, revert its commit and run `npm ci` from the restored lockfile. No npm release, database migration, or production deployment is performed by these development changes.
"""
          ]
          for old in removals:
              if old not in text:
                  raise SystemExit('expected release-history text not found')
              text = text.replace(old, '')
          text = text.replace('## TypeScript development and version 4.0.0 migration', '## TypeScript development')
          text = text.replace('Version 5.0.0 has no runtime dependency on model, mediator, or view.', 'The package has no runtime dependency on model, mediator, or view.')
          text = text.replace('Breaking public API changes are communicated with a Semantic Versioning major release and documented migration notes.', 'Breaking public API changes are communicated with a Semantic Versioning major release and migration notes outside this README.')
          p.write_text(text)
          PY
          if grep -En '^#{2,3} Version [0-9]+.*migration|version [0-9]+\.[0-9]+\.[0-9]+ migration|Version [0-9]+\.[0-9]+\.[0-9]+ has|This is a major release|undo this migration' README.md; then
            echo 'README still contains project release-history prose.' >&2
            exit 1
          fi
      - name: Commit README
        run: |
          git add README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Keep README focused on current Router API'
          git push
